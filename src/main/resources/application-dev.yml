server:
  port: 8082
  tomcat:
    mbeanregistry:
      enabled: true
    max-connections: 500      # 原 20，最大连接数
    threads:
      max: 200                # 原 20，处理请求的线程数
      min-spare: 20           # 原 10
    accept-count: 100         # 原 10，等待队列

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 50  #原 20
        max-pool-size: 100  #原 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置
spring:
  datasource:
    username: root

    password: 123
    url: jdbc:mysql://192.168.100.128:3306/group_buy_market?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver




    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: Retail_HikariCP
      minimum-idle: 20  #原 10
      idle-timeout: 180000
      maximum-pool-size: 100  #原 20
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  # RabbitMQ
  rabbitmq:
    addresses: 192.168.100.128
    port: 5672
    username: eatsPro
    password: 1234
    listener:
      simple:
        prefetch: 1
    template:
      delivery-mode: persistent
    # 消息配置
    config:
      producer:
        exchange: eats_pro_exchange
        topic_team_success:
          routing_key: eats.pintuan.team.success
          queue: eats_pro_queue_team_success
        topic_team_refund:
          routing_key: eats.pintuan.team.refund
          queue: eats_pro_queue_team_refund

# MyBatis 配置
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

# Redis
redis:
  sdk:
    config:
      host: localhost
      port: 6379
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

# DCC 动态配置中心 (替代 xfg-wrench)
dcc:
  downgradeSwitch: "0"
  cutRange: "100"
  cacheSwitch: "0"
  scBlacklist: "s02c02"

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  prometheus:
    enabled: true

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml
